# Contract for config/template.toml (the repository's template).
# Each student copies this file to ~/.alfabeta/<student>/config.toml and changes the changeme values.
# A key that is missing, extra, changes type or contains changeme stops alfabeta (FR-003).

[student]
# Name Claude uses to address the family in the chat. The command never prints it (nor log, URL or Drive).
display_name = "changeme"
# School year, first level of the folder structure.
school_year = "changeme"            # e.g. "2026-2027"
# Grade level, for the notebook names.
grade_level = "changeme"            # e.g. "1º ESO"
# Languages that titles and announcements may come in.
languages = ["changeme"]            # e.g. ["es", "en"]

[classroom]
# Email address of the school account. Compared locally with the account button; never goes in a URL.
account = "changeme@example.org"

[drive]
# alfabeta's own folder inside the Drive mounted by Google Drive for desktop.
# Never the root of «Mi unidad» (My Drive). Never shown in messages.
root = "changeme"                   # e.g. "~/Library/CloudStorage/GoogleDrive-<account>/Mi unidad/alfabeta"

[downloads]
# Folder where the browser leaves its downloads.
folder = "changeme"                 # e.g. "~/Downloads"

[sync]
# Every how many days all attachments are downloaded again to check their hash.
full_review_days = 7
# Minutes without activity after which the lock of a dead run is released on its own.
lock_idle_minutes = 30
# How many captures are kept per class in the data folder.
kept_captures = 10

[tools]
# Local folder where the skills copy their working scripts. Outside Dropbox and the shared folder.
folder = "changeme"                 # e.g. "~/.alfabeta/tools"
# Clone of the alfabeta repository; the skills run `uv run --project <repository> python -m alfabeta`
# on the Mac (never in the app's virtual machine).
repository = "changeme"             # e.g. "~/opt/alfabeta"

[sciencebits]
# If no subject has book = "sciencebits", url = "" and languages = [] are valid.
# Science Bits class page.
url = "changeme"                    # e.g. "https://learning-bits.com/intranet/es/myclasses/index"
# Languages each topic is captured in; the first one gives the topic folder's title.
languages = ["changeme"]            # e.g. ["es", "en"]

[notebook]
# Whether the Gemini Notebook notebook of each topic is created (epic 3; the Science Bits skill already does it).
enabled = false
# The constitution sets the name: «<grade level>. <Subject>. Tema NN - <title>».

[[subjects]]
# Name of the subject's folder.
folder = "changeme"                 # e.g. "Mates"
# Title of the class in Classroom; used to propose the link, which then goes by id.
classroom_class = "changeme"
# Book provider, or "" if none. It is also the name of its subfolder.
# Book topics are not configured: they are the «Tema NN - <title>» folders that already hold that subfolder.
book = "changeme"                   # e.g. "sciencebits"
# Name of the class on the book's platform, or "" if there is no book.
book_class = "changeme"             # e.g. "Matemáticas - 1º ESO"

[schedule]
# Time of the daily sync (local time), or "" for on demand only.
daily = "changeme"                  # e.g. "17:30"
