# alfabeta's configuration template (spec 001 FR-001; spec 004 adds [storage], [calendar] id and [google];
# spec 005 adds [notes] and four [notebook] keys; spec 002 adds language to [[subjects]]; spec 009 adds the rules_ keys).
# Each student copies this file to ~/.alfabeta/<student>/config.toml and changes the changeme values.
# A key that is missing, extra, changes type or contains changeme stops alfabeta (FR-003);
# `alfabeta --home <dir> config check --student <id>` lists every such key, never its value.

[student]
# Name Claude uses to address the family in the chat. The command never prints it (nor log, URL or Drive).
display_name = "changeme"
# School year, first level of the folder structure.
school_year = "changeme"            # e.g. "2026-2027"
# Grade level, for the notebook names.
grade_level = "changeme"            # e.g. "1º ESO"
# Languages that titles and announcements may come in.
languages = ["changeme"]            # e.g. ["es", "en"]
# Standing rules (spec 009): what the family says once about this student, added to the prompts of the
# study material of every subject. rules_both reaches every piece that takes rules, rules_problems the
# problems and practice sheets, the quiz and the parent guide, rules_theory the theory sheet and the
# summary. "" means no rule; a subject's rule prevails over the student's.
# Write them as literal strings, '''like this''': in "quotes" a backslash or a quote can stop every command
# reading this file, or silently change the text. Use your own words: a line copied from these examples
# would make the guardrail report the example.
# The notebook keeps a piece's prompt, and may show it to the accounts it is shared with: no rule that
# describes a difficulty until that has been checked (spec 009 FR-009).
rules_both = "changeme"             # e.g. '''Da cada término clave también en el idioma de la asignatura.'''
rules_problems = "changeme"         # e.g. '''Clasifica también las formas del enunciado y di cómo leer cada una.'''
rules_theory = "changeme"           # e.g. '''Cierra cada sección con una definición de una línea.'''

[classroom]
# Email address of the school account. Compared locally with the account button; never goes in a URL.
account = "changeme@example.org"

[storage]
# The student's base folder on the Mac, outside the Google Drive for desktop mount (spec 004 R7):
# every run refuses one under ~/Library/CloudStorage/GoogleDrive-*. Never shown in messages.
base = "changeme"                   # e.g. "~/alfabeta/<student>"

[drive]
# The alfabeta folder's path inside the student's My Drive (spec 004), never the root of My Drive.
root = "changeme"                   # e.g. "alfabeta"
# The student's other accounts (FR-011a): each can edit the school-year folder inside `root`, shared
# through alfabeta's own connection, so they see the same files with no copy. Checked on every sync; a
# share is never removed. Never shown in messages. [] for none.
share_with = ["changeme"]           # e.g. ["<student>@<school domain>"]

[calendar]
# The family calendar alfabeta writes to, as the student's Gmail (spec 004). Never printed.
id = "changeme@group.calendar.google.com"
# Accounts the student's calendar is shared with, each with permission to see all event details
# (FR-011b; the operator shares it by hand, spec 003 research R13 checks it). [] for none.
shared_with = ["changeme@example.org"]

[downloads]
# Folder where the browser leaves its downloads.
folder = "changeme"                 # e.g. "~/Downloads"

[sync]
# Every how many days all attachments are downloaded again to check their hash.
full_review_days = 7
# Minutes without activity after which the lock of a dead run is released on its own.
lock_idle_minutes = 30
# How many captures are kept per class in the data folder.
kept_captures = 10

[tools]
# Local folder where the skills copy their working scripts. Outside Dropbox and the base folder.
folder = "changeme"                 # e.g. "~/.alfabeta/tools"
# Clone of the alfabeta repository; the skills run `uv run --project <repository> python -m alfabeta`
# on the Mac (never in the app's virtual machine).
repository = "changeme"             # e.g. "~/opt/alfabeta"

[sciencebits]
# If no subject has book = "sciencebits", url = "" and languages = [] are valid.
# Science Bits class page.
url = "changeme"                    # e.g. "https://learning-bits.com/intranet/es/myclasses/index"
# Languages each topic is captured in; the first one gives the topic folder's title.
languages = ["changeme"]            # e.g. ["es", "en"]

[notebook]
# Whether the Gemini Notebook notebook of each topic is created (epic 3; the Science Bits skill already does it).
enabled = false
# The constitution sets the name: «<grade level>. <Subject>. Tema NN[X] - <title>» (X: a subtopic's letter).
# Accounts each topic notebook is shared with as viewer (FR-011b). [] for none.
share_with = ["changeme@example.org"]
# Name of each topic's notebook, used to find it (spec 005 research R9): {grade} is the grade level,
# {subject} the subject's folder, {topic} the topic folder's name after its date, so a teacher's
# topic is named the same way.
title_pattern = "changeme"          # e.g. "{grade}. {subject}. {topic}"
# `nlm` profile of the account that owns the notebooks.
nlm_profile = "changeme"            # e.g. "family"
# That account's address: the only one each topic's living files are shared with, as reader
# (spec 005 FR-009, spec 001 FR-011b).
owner = "changeme@example.com"
# Minutes between the Mac's refreshes of changed living files as the notebook owner (spec 005
# FR-018, research R14); a divisor of 60. The launchd agent also runs once when a sleeping Mac wakes
# and once when the session starts. Only `notebook agent install` reads it: run that again after a change.
refresh_minutes = 15

[notes]
# Claude model that transcribes the photos of the student's notes (spec 005 research R5).
model = "changeme"                  # e.g. "claude-sonnet-5-5"
# That model's published price in USD per million tokens, in and out, for the report's spend.
# 0 is refused: a spend reported as zero would hide a real one.
price_in = 0.0                      # e.g. 2.0
price_out = 0.0                     # e.g. 10.0
# Pages a living file may hold before the run warns the family (spec 005 research R12).
warn_pages = 100
# Hours since the cloud's last successful run after which the Mac's sync warns (spec 005 FR-017).
cloud_stale_hours = 2

[schedule]
# Time of the scheduled sync on each weekday (local time, "HH:MM"), or "" for no sync that day.
# Seven "" = on demand only.
monday = "changeme"                 # e.g. "16:15"
tuesday = "changeme"                # e.g. "16:15"
wednesday = "changeme"              # e.g. "15:15"
thursday = "changeme"               # e.g. "15:15"
friday = "changeme"                 # e.g. "16:15"
saturday = "changeme"               # e.g. ""
sunday = "changeme"                 # e.g. ""
# Minutes a scheduled run waits for the family to sign in to Classroom, after notifying them on the
# Mac, before it stops (spec 001 FR-021a). 0 = stop at once.
wait_minutes = 60

[google]
# A label for the operator, never an id or a secret.
project_label = "changeme"

[google.accounts.changeme]
# One table per linked account; the alias is the table's name (e.g. [google.accounts.student]),
# lowercase ASCII, and logs use only the alias.
# Roles: "student" (Calendar and Drive, these scopes), "family" (spec 006: gmail.send, openid, email) and
# "mail" (spec 010: the student's Gmail linked again, alone, for the labels of shared notebooks' notices,
# scopes gmail.settings.basic, gmail.modify, openid and email).
role = "student"
# Kept only here to check that linking picked the right account. Never printed.
address = "changeme@example.com"
scopes = [
  "https://www.googleapis.com/auth/calendar.events",
  "https://www.googleapis.com/auth/drive",
  "openid",
  "email",
]

[[subjects]]
# Name of the subject's folder.
folder = "changeme"                 # e.g. "Mates"
# Title of the class in Classroom; used to propose the link, which then goes by id.
classroom_class = "changeme"
# Book provider, or "" if none. It is also the name of its subfolder.
# Book topics are not configured: they are the «<YYYYMMDD> - Tema NN - <title>» folders (any date) that already hold that subfolder.
book = "changeme"                   # e.g. "sciencebits"
# Name of the class on the book's platform, or "" if there is no book.
book_class = "changeme"             # e.g. "Matemáticas - 1º ESO"
# Language the subject is taught and examined in, a code as in [student] languages (spec 002 FR-005):
# the study pack writes the practice sheet, the quiz and the flashcards in it.
language = "changeme"               # e.g. "en"
# Standing rules of this subject (spec 009; see [student]). Examples for a subject of calculation, then
# one of languages:
#   rules_problems = '''Separa los tipos de problema con detalle, aunque la hoja crezca.'''
#   rules_theory = '''Cada regla va con un ejemplo corto, primero en el idioma de clase.'''
rules_both = "changeme"
rules_problems = "changeme"
rules_theory = "changeme"
