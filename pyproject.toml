[project]
name = "alfabeta"
version = "0.1.0"
description = "Study material, Classroom and the family calendar for one student, run on the family's Mac."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff", "pyright", "pytest", "jsonschema"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alfabeta"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]
# scripts/ holds tools that .agent's setup.py exports into the working tree; they are not tracked here.
extend-exclude = ["skills/sciencebits-a-notebooklm", "scripts"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "SIM", "UP", "RUF", "D", "TC", "ANN"]
ignore = ["E501", "D100", "D104", "D107", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D", "RUF001", "RUF012", "RUF043", "RUF059", "TC", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
